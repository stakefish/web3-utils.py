name: SAST
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  run-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install dependencies
        # The Makefile installs with uv, which the runner does not ship. UV_SYSTEM_PYTHON targets the
        # interpreter setup-python provides, since uv otherwise refuses to install outside a virtualenv.
        # Set here rather than as `--system` in the Makefile, which would make a local `make install`
        # bypass the developer's own virtualenv.
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          pip install uv
          make install
      - uses: AppThreat/sast-scan-action@master
        with:
          output: reports
          type: python, depscan
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports
          retention-days: 5
