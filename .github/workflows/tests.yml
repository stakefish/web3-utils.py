name: Run tests
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install dependencies
        # The Makefile installs with uv, which the runner does not ship. UV_SYSTEM_PYTHON targets the
        # interpreter setup-python provides, since uv otherwise refuses to install outside a virtualenv.
        # Set here rather than as `--system` in the Makefile, which would make a local `make install`
        # bypass the developer's own virtualenv.
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          pip install uv
          make install
      - name: Check style format
        run: make lint
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.14.2'
          cache: 'npm'
      - name: Install Node.js dependencies
        run: |
          npm ci
      - name: Run tests
        run: make test
