name: Run tests
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          pip install uv
          make install
      - name: Check style format
        run: make lint
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          # Single source of truth with local nvm, mirroring python-version-file above.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Node.js dependencies
        run: |
          npm ci
      - name: Run tests
        run: make test
